
# --- library/github@1.0.0 ---
github_search_issues:
  write: false
  connection: github
  required_credentials: ["op://Engineering/GitHub/token"]
  network_allowlist: ["api.github.com"]
  description: "Search GitHub issues and pull requests with the search API (read-only)."

github_read_file:
  write: false
  connection: github
  required_credentials: ["op://Engineering/GitHub/token"]
  network_allowlist: ["api.github.com"]
  description: "Read a file's contents from a GitHub repository (read-only)."

github_create_issue:
  write: true
  connection: github
  required_credentials: ["op://Engineering/GitHub/token"]
  network_allowlist: ["api.github.com"]
  description: "Open a new GitHub issue (write)."

# --- library/jira@1.2.0 ---
jira_search:
  write: false
  connection: jira
  required_credentials: ["op://Engineering/Jira/api_token", "op://Engineering/Jira/email"]
  network_allowlist: ["*.atlassian.net"]
  description: "Search Jira issues with JQL (read-only)."

jira_create_issue:
  write: true
  connection: jira
  required_credentials: ["op://Engineering/Jira/api_token", "op://Engineering/Jira/email"]
  network_allowlist: ["*.atlassian.net"]
  description: "Create a Jira issue (write)."

# --- library/notion@1.1.0 ---
notion_search:
  write: false
  connection: notion
  required_credentials: ["op://Engineering/Notion/token"]
  network_allowlist: ["api.notion.com"]
  description: "Search pages and databases shared with the integration (read-only)."

notion_read_page:
  write: false
  connection: notion
  required_credentials: ["op://Engineering/Notion/token"]
  network_allowlist: ["api.notion.com"]
  description: "Read a Notion page's block content (read-only)."

notion_append_blocks:
  write: true
  connection: notion
  required_credentials: ["op://Engineering/Notion/token"]
  network_allowlist: ["api.notion.com"]
  description: "Append blocks to an existing Notion page (write)."

notion_create_page:
  write: true
  connection: notion
  required_credentials: ["op://Engineering/Notion/token"]
  network_allowlist: ["api.notion.com"]
  description: "Create a new page under an existing parent page (write)."
